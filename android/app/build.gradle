plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Gradle does NOT expose android/local.properties as project properties, so the
// key has to be read from the file directly. This closure is deliberately
// self-contained: a `def` in the script body is NOT visible inside the
// `android { defaultConfig { } }` DSL closure (Gradle resolves it against the
// Project and throws "Could not get unknown property").
ext.resolveGoogleMapsApiKey = { ->
    def props = new Properties()
    def file = rootProject.file("local.properties")
    if (file.exists()) {
        file.withReader("UTF-8") { reader -> props.load(reader) }
    }
    return (props.getProperty("GOOGLE_MAPS_API_KEY")
            ?: System.getenv("GOOGLE_MAPS_API_KEY")
            ?: "").toString().trim()
}

android {
    namespace = "com.fieldvisit.field_visit_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.fieldvisit.field_visit_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // The Google Maps SDK refuses to render without a valid key, which shows
        // up as a blank grey map. Key comes from android/local.properties (or the
        // GOOGLE_MAPS_API_KEY env var) so the secret stays out of git.
        // Merge into the existing map instead of replacing it: the Flutter Gradle
        // plugin supplies its own placeholders (e.g. applicationName), and
        // assigning a whole new map wipes them, which breaks the manifest merger.
        manifestPlaceholders.googleMapsApiKey = resolveGoogleMapsApiKey()
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
