name: field_visit_app
description: "Field Visit Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.2

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.4.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Notifications
  flutter_local_notifications: ^17.2.1

  # Maps & Location
  google_maps_flutter: ^2.6.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Renders the Google map inside a WebView using the Maps JavaScript API.
  # This is what allows the API key to be supplied at RUNTIME from the in-app
  # Map Settings form. The native Android Maps SDK only reads the key from
  # AndroidManifest.xml at process start (flutter/flutter#41244 is still an
  # open proposal), so a WebView is the only way for an in-app credential to
  # take effect without rebuilding the app.
  webview_flutter: ^4.8.0

  # QR Code
  mobile_scanner: ^5.0.0

  # Image
  image_picker: ^1.1.2

  # Typography
  google_fonts: ^6.1.0

  # Utils
  url_launcher: ^6.3.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.2

# geolocator_android 4.6.2 has a broken build.gradle (flutter.compileSdkVersion)
# that fails on Flutter 3.24.5. See https://github.com/Baseflow/flutter-geolocator/issues/1666
dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
